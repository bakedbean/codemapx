[package]
name = "codemapx"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "codemapx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
vt100 = { version = "0.15.2", package = "fnug-vt100" }

[dev-dependencies]
tempfile = "3"
